name: Release

# Pushing a tag like v1.0.0 builds the wheel and sdist and attaches them, with checksums and
# the changelog section, to a GitHub release. Nothing is published to PyPI: that isn't set up,
# and the "Private :: Do Not Upload" classifier makes PyPI reject an accidental upload.
#
# The same build runs as a dry run (no release) when this workflow, the changelog or the
# version changes in a pull request, and when started by hand from the Actions tab.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release-notes.sh
      - CHANGELOG.md
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Read the version and check it against the tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(uv run --frozen python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME doesn't match the version in pyproject.toml (v$version)" >&2
            exit 1
          fi
      - name: Release notes from the changelog
        env:
          REF_TYPE: ${{ github.ref_type }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # A real release needs its own section; a dry run may use [Unreleased].
          if [ "$REF_TYPE" = "tag" ]; then section="$VERSION"; else section="Unreleased"; fi
          scripts/release-notes.sh "$section" > release-notes.md
          cat release-notes.md
      - name: Install (lockfile must be up to date)
        run: uv sync --locked
      - name: Test
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --frozen pytest
      - name: Build wheel and sdist
        run: |
          rm -rf dist
          uv build
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Smoke-test the built wheel
        env:
          OVO_INSIGHTS_DATA_DIR: ${{ runner.temp }}/ovo-insights-release-smoke
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          out="$(uv run --isolated --no-project --with dist/*.whl ovo-insights --version)"
          echo "$out"
          [ "$out" = "ovo-insights $VERSION" ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/*
            release-notes.md
          if-no-files-found: error

  publish:
    name: create the GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          flags=()
          # A version like 1.0.0rc1 or 0.9.0a2 is a pre-release.
          if [[ "$VERSION" =~ [a-zA-Z] ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --verify-tag \
            --title "ovo-insights $VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"
